version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sscatfacts-db
    restart: always
    environment:
      POSTGRES_USER: sscatuser
      POSTGRES_PASSWORD: sscatpassword
      POSTGRES_DB: sscatfacts_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: